server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # Auth Routes
        - id: auth-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/auth/**
        - id: auth-service-exact
          uri: http://user-service:8081
          predicates:
            - Path=/api/auth

        # User Routes
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
        - id: user-service-exact
          uri: http://user-service:8081
          predicates:
            - Path=/api/users

        # Movie Routes
        - id: movie-service
          uri: http://movie-service:8082
          predicates:
            - Path=/api/movies/**
        - id: movie-service-exact
          uri: http://movie-service:8082
          predicates:
            - Path=/api/movies

        # Theatre Routes
        - id: theatre-service
          uri: http://theatre-service:8083
          predicates:
            - Path=/api/theatres/**
        - id: theatre-service-exact
          uri: http://theatre-service:8083
          predicates:
            - Path=/api/theatres
        - id: show-service
          uri: http://theatre-service:8083
          predicates:
            - Path=/api/shows/**
        - id: show-service-exact
          uri: http://theatre-service:8083
          predicates:
            - Path=/api/shows

        # Booking Routes
        - id: booking-service
          uri: http://booking-service:8084
          predicates:
            - Path=/api/bookings/**
        - id: booking-service-exact
          uri: http://booking-service:8084
          predicates:
            - Path=/api/bookings

        # Payment Routes
        - id: payment-service
          uri: http://payment-service:8085
          predicates:
            - Path=/api/payments/**
        - id: payment-service-exact
          uri: http://payment-service:8085
          predicates:
            - Path=/api/payments

        # Notification Routes
        - id: notification-service
          uri: http://notification-service:8086
          predicates:
            - Path=/api/notifications/**
        - id: notification-service-exact
          uri: http://notification-service:8086
          predicates:
            - Path=/api/notifications

        # Review Routes
        - id: review-service
          uri: http://review-service:8087
          predicates:
            - Path=/api/reviews/**
        - id: review-service-exact
          uri: http://review-service:8087
          predicates:
            - Path=/api/reviews

        # Analytics Routes
        - id: analytics-service
          uri: http://analytics-service:8088
          predicates:
            - Path=/api/analytics/**
        - id: analytics-service-exact
          uri: http://analytics-service:8088
          predicates:
            - Path=/api/analytics

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
